name: CodeQL

# Static analysis (SAST) for the Rust code base via GitHub CodeQL. Rust is a
# supported CodeQL language (public preview); the v3 codeql-action handles the
# build/extraction. Findings surface in the repo's code-scanning / Security tab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Mondays at 07:23 UTC (off-peak, offset from the Scorecard run).
    - cron: "23 7 * * 1"

# Minimal default; the analyze job widens only the scopes CodeQL needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      # Upload code-scanning results to the Security tab.
      security-events: write
      # Read the repo contents and Actions metadata CodeQL inspects.
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: rust

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
