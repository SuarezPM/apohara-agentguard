name: Scorecard

# OpenSSF Scorecard: automated supply-chain security posture analysis.
# Results are published to the public OpenSSF dashboard and uploaded as SARIF
# so findings surface in the repo's GitHub code-scanning / Security tab.
on:
  schedule:
    # Weekly, Mondays at 06:17 UTC (off-peak to avoid the top-of-hour rush).
    - cron: "17 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the analysis job widens only the scopes it needs.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Mint the OIDC token Scorecard uses to publish results.
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public OpenSSF dashboard, enabling the README badge.
          publish_results: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
