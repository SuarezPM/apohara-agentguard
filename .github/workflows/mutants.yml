# Mutation-testing budget gate (Story T4 + audit-remediation F1): cargo-mutants
# over the decision logic, now a HARD gate with an explicit survived-mutant
# budget. Scope = the budget scope (policy/** + gate/taxonomy.rs); the
# taxonomy guards classified as EQUIVALENT mutants (pure pre-filters whose
# outcome is forced by the regex that follows) and the Kani-verified
# `proofs` harnesses (verified by cargo-kani, unreachable by mutation) are
# documented in docs/AUDIT-REMEDIATION-2026-09.md and carried as budget,
# not as silent survivors. Tighten MUTANT_BUDGET to 0 as kills land.
name: mutants

on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 06:17 UTC (off the top of the hour, per GitHub advice).
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Survived-mutant budget for the scoped run. Derived from the measured
  # baseline after the kill tests (audit-remediation F1); every remaining
  # survivor is individually classified (equivalent guard / Kani proof).
  # REDUCING this number is the only allowed direction of travel.
  MUTANT_BUDGET: "17"

jobs:
  mutants:
    name: cargo-mutants (budget gate)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants

      # Same scoped command as the local baseline: policy/** + gate/**,
      # excluding the packs data tables. `-j "$(nproc)"` = one job per core;
      # generous wall-clock cap via coreutils timeout (the run may end early
      # on the 4-core runner — partial results are still written incrementally
      # and are valid for triage).
      - name: Mutation-test the budget scope
        run: |
          set -o pipefail
          timeout 3600 cargo mutants \
            -j "$(nproc)" \
            -f 'src/policy/**' -f 'src/gate/taxonomy.rs' \
            -o target/mutants 2>&1 | tee mutants-run.log

      # HARD gate: the run must complete AND stay within the survived budget.
      - name: Assert survived-mutant budget
        run: |
          set -euo pipefail
          if grep -qE '^(ERROR|ERROR:)' mutants-run.log; then
            echo "::error::cargo-mutants run failed (infra error in log)."; exit 1
          fi
          missed=$(grep -cE '^MISSED' mutants-run.log || true)
          echo "Survived (MISSED) mutants: ${missed} / budget ${MUTANT_BUDGET}"
          if [ "${missed}" -gt "${MUTANT_BUDGET}" ]; then
            echo "::error::Survived mutants (${missed}) exceed budget (${MUTANT_BUDGET})."
            grep -E '^MISSED' mutants-run.log
            exit 1
          fi

      - name: Append result summary to the job summary
        if: always()
        run: |
          {
            echo "## cargo-mutants (policy + gate)"
            echo '```'
            grep -E 'tested in|^MISSED|^TIMEOUT|Unviable|ERROR' mutants-run.log | tail -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-out
          path: |
            mutants-run.log
            target/mutants/
          if-no-files-found: warning
