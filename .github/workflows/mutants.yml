# Mutation-testing baseline (Story T4): cargo-mutants over the decision logic.
#
# INFORMATIONAL ONLY — this job is continue-on-error on purpose: until a
# survived-mutant budget policy is decided (e.g. "zero survived mutants in
# src/policy/engine.rs"), mutation results must not gate merges. Triage the
# uploaded artifact instead.
name: mutants

on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 06:17 UTC (off the top of the hour, per GitHub advice).
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: cargo-mutants (policy + gate)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants

      # Same scoped command as the local baseline: policy/** + gate/**,
      # excluding the packs data tables. `-j "$(nproc)"` = one job per core;
      # generous wall-clock cap via coreutils timeout (the run may end early
      # on the 4-core runner — partial results are still written incrementally
      # and are valid for triage).
      - name: Mutation-test the decision logic
        run: |
          set -o pipefail
          timeout 3600 cargo mutants \
            -j "$(nproc)" \
            -f 'src/policy/**' -f 'src/gate/**' \
            -e 'src/gate/packs/**' \
            -o target/mutants 2>&1 | tee mutants-run.log

      - name: Append result summary to the job summary
        if: always()
        run: |
          {
            echo "## cargo-mutants (policy + gate)"
            echo '```'
            grep -E 'tested in|^MISSED|^TIMEOUT|Unviable|ERROR' mutants-run.log | tail -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-out
          path: |
            mutants-run.log
            target/mutants/
          if-no-files-found: warning
