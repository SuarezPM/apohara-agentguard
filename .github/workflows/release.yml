name: Release

# Builds the cross-platform binaries (minimal 2-target matrix: x86_64-unknown-linux-musl
# + aarch64-apple-darwin), regenerates THIRD-PARTY-LICENSES, and emits a SHA256 manifest.
# Each binary carries an embedded dependency inventory (SBOM) via cargo-auditable at BUILD
# time — strictly upstream of SHA256 hashing and SLSA attestation, so hashes and provenance
# describe exactly the shipped bytes. The review bundle additionally carries a CycloneDX SBOM
# (cargo-cyclonedx), a keyless Sigstore signature bundle (.sigstore.json) per shipped binary
# (cosign), AND an offline SLSA provenance bundle (*.intoto.jsonl) per target from the
# isolated SLSA L3 attest job (_attest.yml). It does NOT auto-publish: tag creation, GitHub
# Release submission, and crates.io/npm publish are left to a maintainer (RELEASING.md).
# Trigger manually (workflow_dispatch) or on a v* tag to assemble the artifact set for review.
# Minimal assets (2 targets ×2 bins =4 bins +4 sigstore +2 intoto +SHA256+cdx+packs ≈13) vs legacy 34.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# Minimal default; the `attest` job overrides with the write scopes the SLSA L3
# provenance signing needs (id-token/attestations write — see below + _attest.yml).
permissions:
  contents: read

jobs:
  third-party-licenses:
    name: regenerate THIRD-PARTY-LICENSES
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-about
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: cargo-about
      - name: Generate THIRD-PARTY-LICENSES
        run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: THIRD-PARTY-LICENSES
          path: THIRD-PARTY-LICENSES

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # SLSA L3 isolation: the build job no longer holds id-token/attestations
    # permissions and does NOT sign. Provenance is generated in the separate
    # reusable `attest` job below (see _attest.yml), so caller-controlled build
    # steps cannot influence signing. The build only stages + uploads the
    # binary for the isolated attest job to consume.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            cross: true
            # x86_64-unknown-linux-musl works with cross 0.2.5's
            # default image; the build is empirically verified locally
            # (Story 5 F5 dry-run, 5.4M static-pie binary).
            cross_image: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # SBOM story: embed a dependency inventory into each binary at BUILD
      # time via cargo-auditable (zlib JSON in the `.dep-v0` linker section).
      # It is an out-of-tree build tool — it wraps the build command only and
      # adds nothing to Cargo.toml / Cargo.lock (purity guard). Native targets
      # wrap cargo directly; `cross` targets need the wrapper INSIDE the build
      # container: cross mounts host CARGO_HOME at /cargo but shadows
      # /cargo/bin with an anonymous volume, so the wrapper is staged under
      # libexec/ and built as a static musl binary that runs in any image.
      - name: Install cargo-auditable (native)
        if: matrix.cross != true
        run: cargo install --locked cargo-auditable

      - name: Install cargo-auditable (static wrapper for cross containers)
        if: matrix.cross == true
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo install --locked cargo-auditable --target x86_64-unknown-linux-musl
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}/libexec/auditable"
          cp "${CARGO_HOME:-$HOME/.cargo}/bin/cargo-auditable" "${CARGO_HOME:-$HOME/.cargo}/libexec/auditable/cargo-auditable"

      # x86_64 musl is cross-compiled with `cross` (provides the cross toolchain
      # + a suitable container image). aarch64-apple-darwin builds natively on macos.
      - name: Install cross (x86_64 musl)
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build (native)
        if: matrix.cross != true
        run: cargo auditable build --release --locked --target ${{ matrix.target }}

      - name: Build (cross, default image)
        if: matrix.cross == true && matrix.cross_image == ''
        env:
          # cargo-auditable's rustc-wrapper mode requires this var (its entry
          # gate + metadata flags); cross forwards it into the container by
          # default. The JSON mirrors the flags actually passed (--locked).
          CARGO_AUDITABLE_ORIG_ARGS: '{"offline":false,"locked":true,"frozen":false,"config":[]}'
          # cross whitelists forwarded env vars and RUSTC_WORKSPACE_WRAPPER is
          # not among them; inject it container-side only (host-side probes
          # must stay unwrapped or they fail on the container-only path).
          # Value is the IN-CONTAINER mount of CARGO_HOME (/cargo), under
          # libexec/ because cross shadows /cargo/bin.
          CROSS_CONTAINER_OPTS: >-
            --env RUSTC_WORKSPACE_WRAPPER=/cargo/libexec/auditable/cargo-auditable
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (cross, custom image)
        if: matrix.cross == true && matrix.cross_image != ''
        env:
          CARGO_AUDITABLE_ORIG_ARGS: '{"offline":false,"locked":true,"frozen":false,"config":[]}'
          CROSS_CONTAINER_OPTS: >-
            --env RUSTC_WORKSPACE_WRAPPER=/cargo/libexec/auditable/cargo-auditable
        run: |
          cat > Cross.toml <<EOF
          [target.${{ matrix.target }}]
          image = "${{ matrix.cross_image }}"
          EOF
          cross build --release --locked --target ${{ matrix.target }}

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Both declared [[bin]] targets ship in every bundle: agentguard-proxy
          # rides with the main binary under the same <bin>-<target> naming so
          # direct-download and tap channels can fetch it standalone.
          cp "target/${{ matrix.target }}/release/apohara-agentguard${{ matrix.ext }}" \
             "dist/apohara-agentguard-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/agentguard-proxy${{ matrix.ext }}" \
             "dist/agentguard-proxy-${{ matrix.target }}${{ matrix.ext }}"

      # Verify the dependency inventory actually landed in the shipped bytes,
      # BEFORE any hashing or attestation below: if this fails, uninstrumented
      # bytes can never enter SHA256SUMS or SLSA provenance. The payload is
      # zlib-compressed, so `strings | grep` cannot see it; the documented
      # detection is the `.dep-v0` linker section name (readelf ships with
      # binutils on ubuntu runners). Covers all Linux targets — including
      # the cross-built ones — so a silent wrapper-forwarding regression in
      # `cross` fails loudly here. macOS binaries skip this check (no readelf).
      - name: Verify embedded dependency inventory (SBOM)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          f="dist/apohara-agentguard-${{ matrix.target }}${{ matrix.ext }}"
          count=$(readelf -SW "$f" | grep -c '[.]dep-v0' || true)
          echo ".dep-v0 sections in $f: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::dependency inventory missing (.dep-v0 section absent) in $f — cargo-auditable did not instrument this build" >&2
            exit 1
          fi

      # NOTE: provenance attestation NO LONGER happens here. It was moved to the
      # isolated reusable `attest` job (uses: ./.github/workflows/_attest.yml)
      # to satisfy the SLSA L3 build/sign isolation requirement. The subject is
      # still the host-staged binary, so the cross-built musl ELF (which
      # lands on the ubuntu-latest host) is covered like the rest.
      #
      # ROLLBACK: if the reusable-workflow refactor breaks signing in a PUBLIC
      # run, revert to the inline step below (and restore the build job's
      # id-token/attestations: write permissions + drop the `attest` job and its
      # `needs:` from verify-attestations):
      #   - name: Attest build provenance
      #     uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
      #     with:
      #       subject-path: dist/apohara-agentguard-${{ matrix.target }}${{ matrix.ext }}

      - name: Compute SHA256
        shell: bash
        run: |
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
            cat "$f.sha256"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apohara-agentguard-${{ matrix.target }}
          path: dist/*

  # SLSA Build L3: isolated provenance generation. One call per target into the
  # reusable workflow, which downloads that target's staged binary and signs it
  # in a fresh job/VM with no caller build steps. A provenance attestation per
  # target, with signing moved out of the build job (the build cannot forge it).
  #
  # VERIFIED: a public run's attestation passes (and the wrong signer-workflow is
  # rejected):
  #   gh attestation verify <bin> -R SuarezPM/apohara-agentguard \
  #     --signer-workflow SuarezPM/apohara-agentguard/.github/workflows/_attest.yml
  # Minimal 2-target matrix keeps Scorecard window clean (7→2 reduces asset sprawl,
  # intoto.jsonl + sigstore.json per target satisfies Signed-Releases 10/10).
  attest:
    name: attest ${{ matrix.target }}
    needs: build
    # Caller job must ALSO declare these for the reusable workflow's OIDC
    # signing + attestation write to work.
    permissions:
      id-token: write
      attestations: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            ext: ""
          - target: aarch64-apple-darwin
            ext: ""
    uses: ./.github/workflows/_attest.yml
    with:
      artifact-name: apohara-agentguard-${{ matrix.target }}
      subject-name: apohara-agentguard-${{ matrix.target }}${{ matrix.ext }}

  verify-attestations:
    name: verify attestations (E2E)
    needs: [attest, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # E2E gate: every released binary MUST carry a verifiable attestation via
      # GitHub's attestations API (sigstore sig + SLSA provenance).
      # This closes silent gaps — if per-target attestation was skipped, this fails.
      - name: Verify all binaries are attested (provenance)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          while IFS= read -r -d '' bin; do
            found=$((found + 1))
            echo "::group::verify provenance $bin"
            gh attestation verify "$bin" -R SuarezPM/apohara-agentguard \
              --signer-workflow SuarezPM/apohara-agentguard/.github/workflows/_attest.yml
            echo "::endgroup::"
          done < <(find artifacts -type f -name 'apohara-agentguard-*' ! -name '*.sha256' ! -name '*.sigstore.json' ! -name '*.intoto.jsonl' -print0)
          if [ "$found" -eq 0 ]; then
            echo "::error::no binaries found to verify" >&2
            exit 1
          fi
          echo "verified $found attested binaries (provenance)"

      # Verify offline intoto bundles exist, are non-empty, and are valid JSONL/JSON.
      # Scorecard Signed-Releases 10/10 requires *.intoto.jsonl assets; this gate
      # ensures they are present in the release bundle (from _attest.yml export).
      - name: Verify intoto bundles present and valid (Scorecard 10/10)
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for *.intoto.jsonl in artifacts..."
          mapfile -t intotos < <(find artifacts -type f -name '*.intoto.jsonl')
          count=${#intotos[@]}
          echo "found $count intoto bundles"
          for f in "${intotos[@]}"; do
            echo " - $f ($(wc -c < "$f") bytes)"
            ls -l "$f"
            if [ ! -s "$f" ]; then
              echo "::error::empty intoto bundle $f" >&2
              exit 1
            fi
            # basic JSON validity (bundle may be JSON or JSONL)
            head -c 1000 "$f" | python3 -m json.tool >/dev/null 2>&1 || {
              echo "::warning:: $f does not look like JSON, checking JSONL"
              head -n 1 "$f" | python3 -m json.tool >/dev/null || {
                echo "::error::invalid JSON/JSONL in $f" >&2
                exit 1
              }
            }
            # CRITICAL: validate subject content is not a dummy/placeholder.
            # A dummy attestation passes count+JSON checks but attests nothing real.
            # DSSE bundles from actions/attest@v4 use JSONL format — don't try to
            # parse the envelope structure. Instead, check for the known dummy content.
            raw=$(cat "$f")
            if echo "$raw" | grep -q '"name"[[:space:]]*:[[:space:]]*"dummy"'; then
              echo "::error::intoto bundle $f contains literal dummy subject — this is NOT a real attestation" >&2
              exit 1
            fi
            if echo "$raw" | grep -q '"digest"[[:space:]]*:[[:space:]]*{[[:space:]]*"sha256"[[:space:]]*:[[:space:]]*"abc"'; then
              echo "::error::intoto bundle $f contains dummy sha256 'abc' — this is NOT a real attestation" >&2
              exit 1
            fi
            echo "  intoto bundle content check passed (no dummy markers found)"
          done
          # Expect 2 intoto files (one per target's main binary) in minimal matrix
          if [ "$count" -lt 2 ]; then
            echo "::error::expected at least 2 intoto bundles (one per target), found $count" >&2
            exit 1
          fi
          # Also ensure release bundle contains them (manifest should have copied)
          release_intotos=$(find artifacts -path "*/apohara-agentguard-v*-release/*" -name '*.intoto.jsonl' | wc -l)
          echo "intoto bundles inside release artifact: $release_intotos"
          if [ "$release_intotos" -lt 2 ]; then
            echo "::error::release bundle missing intoto provenance (found $release_intotos, expected 2)" >&2
            exit 1
          fi
          echo "intoto verification passed (content-validated, no dummies)"

      # Verify Sigstore bundles exist, are non-empty, and cosign can verify them
      # offline against the transparency log (keyless). Complements provenance.
      - name: Verify sigstore bundles present and valid
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for *.sigstore.json in artifacts..."
          mapfile -t sigs < <(find artifacts -type f -name '*.sigstore.json')
          count=${#sigs[@]}
          echo "found $count sigstore bundles"
          for f in "${sigs[@]}"; do
            echo " - $f ($(wc -c < "$f") bytes)"
            ls -l "$f"
            if [ ! -s "$f" ]; then
              echo "::error::empty sigstore bundle $f" >&2
              exit 1
            fi
          done
          # Minimal matrix: 2 targets ×2 bins (main+proxy) =4 sigstore bundles
          if [ "$count" -lt 4 ]; then
            echo "::error::expected at least 4 sigstore bundles (2 targets ×2 bins), found $count" >&2
            exit 1
          fi
          release_sigs=$(find artifacts -path "*/apohara-agentguard-v*-release/*" -name '*.sigstore.json' | wc -l)
          echo "sigstore bundles inside release artifact: $release_sigs"
          if [ "$release_sigs" -lt 4 ]; then
            echo "::error::release bundle missing sigstore bundles (found $release_sigs, expected 4)" >&2
            exit 1
          fi
          echo "Sigstore bundle presence verified; offline cosign verify next..."

      - name: Verify sigstore signatures offline (cosign)
        shell: bash
        run: |
          set -euo pipefail
          # Find release directory (the manifest bundle)
          release_dir=$(find artifacts -type d -name "apohara-agentguard-v*-release" | head -n 1)
          if [ -z "$release_dir" ]; then
            echo "::error::release artifact directory not found" >&2
            exit 1
          fi
          echo "release dir: $release_dir"
          ls -l "$release_dir" | cat
          # For each binary with a sigstore bundle, verify via cosign verify-blob
          verified=0
          for sig in "$release_dir"/*.sigstore.json; do
            [ -e "$sig" ] || continue
            bin="${sig%.sigstore.json}"
            if [ ! -f "$bin" ]; then
              echo "::warning::bundle $sig has no matching binary $bin, skipping"
              continue
            fi
            echo "::group::cosign verify-blob $bin"
            cosign verify-blob \
              --bundle "$sig" \
              --certificate-identity-regexp '^https://github.com/SuarezPM/apohara-agentguard/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$bin"
            echo "::endgroup::"
            verified=$((verified+1))
          done
          if [ "$verified" -lt 4 ]; then
            echo "::error::cosign verified $verified bundles, expected at least 4" >&2
            exit 1
          fi
          echo "verified $verified sigstore signatures offline"

  # Bundle assembly + supply-chain hardening. id-token: write is scoped HERE
  # ONLY, for the keyless Sigstore signing of the staged binaries below; build
  # jobs stay permissionless (SLSA L3 provenance remains isolated in `attest`,
  # which declares its own scopes). Now also collects the offline *.intoto.jsonl
  # provenance bundles exported by the `attest` job so the final release bundle
  # contains both sigstore and intoto for Scorecard 10/10.
  manifest:
    name: assemble SHA256 manifest
    needs: [build, third-party-licenses, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: cargo-cyclonedx

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Standalone CycloneDX 1.5 SBOM generated from the committed lockfile —
      # complements the embedded cargo-auditable inventory inside each binary.
      # Generated BEFORE hashing so SHA256SUMS covers the exact shipped bytes.
      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5
          f="$(find . -name 'apohara-agentguard.cdx.json' ! -path './.git/*' | head -n 1)"
          if [ -z "$f" ]; then
            echo "::error::cargo-cyclonedx produced no apohara-agentguard.cdx.json" >&2
            exit 1
          fi
          mkdir -p release
          mv "$f" release/apohara-agentguard.cdx.json

      - name: Build combined SHA256SUMS
        shell: bash
        run: |
          mkdir -p release
          # Collect every binary + its per-file .sha256 into one manifest.
          find artifacts -type f \( -name 'apohara-agentguard-*' -o -name 'agentguard-proxy-*' \) ! -name '*.sha256' ! -name '*.sigstore.json' ! -name '*.intoto.jsonl' -exec cp {} release/ \;
          cp -f artifacts/THIRD-PARTY-LICENSES/THIRD-PARTY-LICENSES release/ || true
          # Plugin manifests ride with the bundle so installs can register
          # hooks without a second fetch (checkout provides them).
          cp -f packaging/plugin.json packaging/hooks.json release/
          # Community rule packs ship as one tarball with FLAT *.toml entries,
          # so install.sh can extract opt-in packs straight into $PREFIX/packs
          # (the loader scans one flat directory) without cloning the repo
          # (checkout provides packs-community/).
          (cd packs-community && tar -czf ../release/agentguard-packs.tar.gz *.toml)
          cd release
          : > SHA256SUMS
          for f in apohara-agentguard-* agentguard-proxy-*; do
            case "$f" in *.sha256|*.cdx.json|*.sigstore.json|*.intoto.jsonl) continue ;; esac
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" >> SHA256SUMS
            else
              shasum -a 256 "$f" >> SHA256SUMS
            fi
          done
          for extra in agentguard-packs.tar.gz apohara-agentguard.cdx.json; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$extra" >> SHA256SUMS
            else
              shasum -a 256 "$extra" >> SHA256SUMS
            fi
          done
          echo "----- SHA256SUMS -----"
          cat SHA256SUMS

      # Collect offline SLSA provenance bundles (*.intoto.jsonl) exported by the
      # isolated attest job. Scorecard Signed-Releases gives 10 only when these
      # are present as release assets alongside *.sigstore.json.
      - name: Collect intoto provenance bundles
        shell: bash
        run: |
          set -euo pipefail
          echo "Collecting intoto bundles from attest artifacts..."
          # Attest artifacts are named apohara-agentguard-<target>.intoto and contain <bin>.intoto.jsonl
          found=$(find artifacts -type f -name '*.intoto.jsonl' | wc -l)
          echo "found $found intoto bundles in artifacts/"
          find artifacts -type f -name '*.intoto.jsonl' -exec cp -v {} release/ \;
          echo "release/ intoto:"
          ls -l release/*.intoto.jsonl || { echo "::error::no intoto bundles copied to release/"; exit 1; }

      # Keyless Sigstore signatures over every binary in the bundle (main +
      # proxy, all targets). Complements the SLSA provenance attestations from
      # the isolated `attest` job with a portable per-file verification bundle;
      # signing never modifies the hashed bytes.
      - name: Sign bundle binaries (keyless Sigstore)
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for f in apohara-agentguard-* agentguard-proxy-*; do
            case "$f" in
              *.sha256|*.cdx.json|*.sigstore.json|*.intoto.jsonl) continue ;;
            esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -1 ./*.sigstore.json
          echo "--- release bundle contents ---"
          ls -lh

      - name: Upload release bundle (for maintainer review — NOT auto-published)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apohara-agentguard-v0.5.4-release
          path: release/*
