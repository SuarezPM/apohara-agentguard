name: Release

# Builds the v0.1 cross-platform binaries, regenerates THIRD-PARTY-LICENSES,
# and emits a SHA256 manifest of the artifacts. Each binary carries an
# embedded dependency inventory (SBOM) injected by cargo-auditable at BUILD
# time — strictly upstream of SHA256 hashing and SLSA attestation, so hashes
# and provenance describe exactly the shipped bytes. It does NOT auto-publish:
# tag creation, GitHub Release submission, and crates.io/npm publish are left
# to a maintainer. Trigger manually (workflow_dispatch) or on a v* tag to
# assemble the artifact set for review.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# Minimal default; the `attest` job overrides with the write scopes the SLSA L3
# provenance signing needs (id-token/attestations write — see below + _attest.yml).
permissions:
  contents: read

jobs:
  third-party-licenses:
    name: regenerate THIRD-PARTY-LICENSES
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-about
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907 # v2
        with:
          tool: cargo-about
      - name: Generate THIRD-PARTY-LICENSES
        run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: THIRD-PARTY-LICENSES
          path: THIRD-PARTY-LICENSES

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # SLSA L3 isolation: the build job no longer holds id-token/attestations
    # permissions and does NOT sign. Provenance is generated in the separate
    # reusable `attest` job below (see _attest.yml), so caller-controlled build
    # steps cannot influence signing. The build only stages + uploads the
    # binary for the isolated attest job to consume.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            cross: true
            cross_image: ""  # default cross image (debian stable)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            cross: true
            # x86_64-unknown-linux-musl works with cross 0.2.5's
            # default image; the build is empirically verified locally
            # (Story 5 F5 dry-run, 5.4M static-pie binary).
            cross_image: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            cross: true
            # aarch64-unknown-linux-musl needs a newer cross image
            # than cross 0.2.5's default (the default image's glibc
            # is too old for modern build scripts). `ghcr.io/cross-rs/
            # aarch64-unknown-linux-musl:main` is the `:main` tag
            # from the official cross-rs image registry and ships
            # current Debian. Empirically verified locally
            # (Story 5 F5 dry-run, 4.4M static binary).
            cross_image: "ghcr.io/cross-rs/aarch64-unknown-linux-musl:main"
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # SBOM story: embed a dependency inventory into each binary at BUILD
      # time via cargo-auditable (zlib JSON in the `.dep-v0` linker section).
      # It is an out-of-tree build tool — it wraps the build command only and
      # adds nothing to Cargo.toml / Cargo.lock (purity guard). Native targets
      # wrap cargo directly; `cross` targets need the wrapper INSIDE the build
      # container: cross mounts host CARGO_HOME at /cargo but shadows
      # /cargo/bin with an anonymous volume, so the wrapper is staged under
      # libexec/ and built as a static musl binary that runs in any image.
      - name: Install cargo-auditable (native)
        if: matrix.cross != true
        run: cargo install --locked cargo-auditable

      - name: Install cargo-auditable (static wrapper for cross containers)
        if: matrix.cross == true
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo install --locked cargo-auditable --target x86_64-unknown-linux-musl
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}/libexec/auditable"
          cp "${CARGO_HOME:-$HOME/.cargo}/bin/cargo-auditable" "${CARGO_HOME:-$HOME/.cargo}/libexec/auditable/cargo-auditable"

      # aarch64 Linux (glibc + musl) is cross-compiled with `cross`
      # (provides the cross toolchain + a suitable container image).
      # The other five build natively (Ubuntu, macOS, Windows).
      - name: Install cross (aarch64 Linux)
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build (native)
        if: matrix.cross != true
        run: cargo auditable build --release --locked --target ${{ matrix.target }}

      - name: Build (cross, default image)
        if: matrix.cross == true && matrix.cross_image == ''
        env:
          # cargo-auditable's rustc-wrapper mode requires this var (its entry
          # gate + metadata flags); cross forwards it into the container by
          # default. The JSON mirrors the flags actually passed (--locked).
          CARGO_AUDITABLE_ORIG_ARGS: '{"offline":false,"locked":true,"frozen":false,"config":[]}'
          # cross whitelists forwarded env vars and RUSTC_WORKSPACE_WRAPPER is
          # not among them; inject it container-side only (host-side probes
          # must stay unwrapped or they fail on the container-only path).
          # Value is the IN-CONTAINER mount of CARGO_HOME (/cargo), under
          # libexec/ because cross shadows /cargo/bin.
          CROSS_CONTAINER_OPTS: >-
            --env RUSTC_WORKSPACE_WRAPPER=/cargo/libexec/auditable/cargo-auditable
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (cross, custom image)
        if: matrix.cross == true && matrix.cross_image != ''
        env:
          CARGO_AUDITABLE_ORIG_ARGS: '{"offline":false,"locked":true,"frozen":false,"config":[]}'
          CROSS_CONTAINER_OPTS: >-
            --env RUSTC_WORKSPACE_WRAPPER=/cargo/libexec/auditable/cargo-auditable
        run: |
          cat > Cross.toml <<EOF
          [target.${{ matrix.target }}]
          image = "${{ matrix.cross_image }}"
          EOF
          cross build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/apohara-agentguard${{ matrix.ext }}"
          dst="dist/apohara-agentguard-${{ matrix.target }}${{ matrix.ext }}"
          cp "$src" "$dst"

      # Verify the dependency inventory actually landed in the shipped bytes,
      # BEFORE any hashing or attestation below: if this fails, uninstrumented
      # bytes can never enter SHA256SUMS or SLSA provenance. The payload is
      # zlib-compressed, so `strings | grep` cannot see it; the documented
      # detection is the `.dep-v0` linker section name (readelf ships with
      # binutils on ubuntu runners). Covers all four Linux targets — including
      # the cross-built ones — so a silent wrapper-forwarding regression in
      # `cross` fails loudly here.
      - name: Verify embedded dependency inventory (SBOM)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          f="dist/apohara-agentguard-${{ matrix.target }}${{ matrix.ext }}"
          count=$(readelf -SW "$f" | grep -c '[.]dep-v0' || true)
          echo ".dep-v0 sections in $f: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::dependency inventory missing (.dep-v0 section absent) in $f — cargo-auditable did not instrument this build" >&2
            exit 1
          fi

      # NOTE: provenance attestation NO LONGER happens here. It was moved to the
      # isolated reusable `attest` job (uses: ./.github/workflows/_attest.yml)
      # to satisfy the SLSA L3 build/sign isolation requirement. The subject is
      # still the host-staged binary, so the cross-built aarch64 ELF (which
      # lands on the ubuntu-latest host) is covered like the rest.
      #
      # ROLLBACK: if the reusable-workflow refactor breaks signing in a PUBLIC
      # run, revert to the inline step below (and restore the build job's
      # id-token/attestations: write permissions + drop the `attest` job and its
      # `needs:` from verify-attestations):
      #   - name: Attest build provenance
      #     uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
      #     with:
      #       subject-path: dist/apohara-agentguard-${{ matrix.target }}${{ matrix.ext }}

      - name: Compute SHA256
        shell: bash
        run: |
          cd dist
          f="apohara-agentguard-${{ matrix.target }}${{ matrix.ext }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$f" > "$f.sha256"
          else
            shasum -a 256 "$f" > "$f.sha256"
          fi
          cat "$f.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apohara-agentguard-${{ matrix.target }}
          path: dist/*

  # SLSA Build L3: isolated provenance generation. One call per target into the
  # reusable workflow, which downloads that target's staged binary and signs it
  # in a fresh job/VM with no caller build steps. A provenance attestation per
  # target, with signing moved out of the build job (the build cannot forge it).
  #
  # VERIFIED: a public run's attestation passes (and the wrong signer-workflow is
  # rejected):
  #   gh attestation verify <bin> -R SuarezPM/apohara-agentguard \
  #     --signer-workflow SuarezPM/apohara-agentguard/.github/workflows/_attest.yml
  attest:
    name: attest ${{ matrix.target }}
    needs: build
    # Caller job must ALSO declare these for the reusable workflow's OIDC
    # signing + attestation write to work.
    permissions:
      id-token: write
      attestations: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            ext: ""
          - target: aarch64-unknown-linux-gnu
            ext: ""
          - target: x86_64-unknown-linux-musl
            ext: ""
          - target: aarch64-unknown-linux-musl
            ext: ""
          - target: x86_64-apple-darwin
            ext: ""
          - target: aarch64-apple-darwin
            ext: ""
          - target: x86_64-pc-windows-msvc
            ext: ".exe"
    uses: ./.github/workflows/_attest.yml
    with:
      artifact-name: apohara-agentguard-${{ matrix.target }}
      subject-name: apohara-agentguard-${{ matrix.target }}${{ matrix.ext }}

  verify-attestations:
    name: verify attestations (E2E)
    needs: attest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      # E2E gate: every released binary MUST carry a verifiable attestation.
      # This closes a silent unattested-aarch64 gap — if the per-target
      # attestation step were skipped or misfired for any target, the verify
      # below fails and the whole workflow fails.
      - name: Verify all binaries are attested
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          while IFS= read -r -d '' bin; do
            found=$((found + 1))
            echo "::group::verify $bin"
            gh attestation verify "$bin" -R SuarezPM/apohara-agentguard
            echo "::endgroup::"
          done < <(find artifacts -type f -name 'apohara-agentguard-*' ! -name '*.sha256' -print0)
          if [ "$found" -eq 0 ]; then
            echo "::error::no binaries found to verify" >&2
            exit 1
          fi
          echo "verified $found attested binaries"

  manifest:
    name: assemble SHA256 manifest
    needs: [build, third-party-licenses]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Build combined SHA256SUMS
        shell: bash
        run: |
          mkdir -p release
          # Collect every binary + its per-file .sha256 into one manifest.
          find artifacts -type f -name 'apohara-agentguard-*' ! -name '*.sha256' -exec cp {} release/ \;
          cp -f artifacts/THIRD-PARTY-LICENSES/THIRD-PARTY-LICENSES release/ || true
          # Plugin manifests ride with the bundle so installs can register
          # hooks without a second fetch (checkout provides them).
          cp -f packaging/plugin.json packaging/hooks.json release/
          # Community rule packs ship as one tarball with FLAT *.toml entries,
          # so install.sh can extract opt-in packs straight into $PREFIX/packs
          # (the loader scans one flat directory) without cloning the repo
          # (checkout provides packs-community/).
          (cd packs-community && tar -czf ../release/agentguard-packs.tar.gz *.toml)
          cd release
          : > SHA256SUMS
          for f in apohara-agentguard-*; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" >> SHA256SUMS
            else
              shasum -a 256 "$f" >> SHA256SUMS
            fi
          done
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum agentguard-packs.tar.gz >> SHA256SUMS
          else
            shasum -a 256 agentguard-packs.tar.gz >> SHA256SUMS
          fi
          echo "----- SHA256SUMS -----"
          cat SHA256SUMS
      - name: Upload release bundle (for maintainer review — NOT auto-published)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apohara-agentguard-v0.3.0-release
          path: release/*
