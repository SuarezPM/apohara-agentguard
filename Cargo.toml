[package]
name = "apohara-agentguard"
version = "0.4.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Deterministic, offline, no-model safety hook + local seccomp+Landlock sandbox + input firewall for Claude Code."
repository = "https://github.com/SuarezPM/apohara-agentguard"

[lib]
name = "apohara_agentguard"
path = "src/lib.rs"

[[bin]]
name = "apohara-agentguard"
path = "src/main.rs"

# V4-B MCP transport proxy: transparent stdio wrapper the client spawns as its
# MCP server command; the real server runs as a piped child behind it.
[[bin]]
name = "agentguard-proxy"
path = "src/bin/agentguard-proxy.rs"

# cargo-binstall distribution: `cargo binstall apohara-agentguard` resolves
# these templates against the GitHub release assets. Assets are bare,
# unarchived binaries named `<bin>-<target>[.exe]`, hence pkg-fmt = "bin" and
# `{ archive-suffix }` (empty everywhere except ".exe" on Windows targets).
# NOTE: binstall requires EVERY [[bin]] target above to exist in the resolved
# package — a missing bin is a hard error — so the release workflow stages
# agentguard-proxy-<triple>[.exe] alongside the main binary.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "bin"

# Windows asset name spelled out literally for template engines that predate
# the { archive-suffix } variable; identical resolution on current versions.
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.exe"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
regex = "1"
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "unicode", "hybrid", "nfa-pikevm"] }
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["sched", "process", "fs", "mount", "user"] }
seccompiler = { version = "0.5", features = ["json"] }
libc = "0.2"
landlock = "0.4"

[dev-dependencies]
proptest = "1"

# Story T8: the Kani proof harnesses are gated on `cfg(kani)`, which only the
# Kani verifier (`cargo kani`) sets. Register it here so `unexpected_cfgs`
# stays quiet under `-D warnings` in every normal build.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# ReDoS guard runs as a plain binary (no libtest harness) so it executes under
# both `cargo test` and `cargo bench`.
[[bench]]
name = "regex_redos"
harness = false

# Hook-path latency: end-to-end in-process `hook::run` p50/p99 timing. Plain
# binary (no libtest harness), same pattern as `regex_redos`.
[[bench]]
name = "hook_latency"
harness = false

[profile.release]
opt-level = 3
lto = true
strip = true
