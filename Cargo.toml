[package]
name = "agentguard"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Deterministic, offline, no-model safety hook + local seccomp+Landlock sandbox + input firewall for Claude Code."
repository = "https://github.com/SuarezPM/agentguard"

[lib]
name = "agentguard"
path = "src/lib.rs"

[[bin]]
name = "agentguard"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30", features = ["sched", "process", "fs", "mount", "user"] }
seccompiler = { version = "0.5", features = ["json"] }
libc = "0.2"
landlock = "0.4"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
